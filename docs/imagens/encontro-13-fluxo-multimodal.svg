<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Entradas multimodais transformadas em evidências</title>
  <desc id="desc">Texto, imagem, áudio, documento e vídeo convergem para processamento, evidências e uma resposta rastreável.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fc}.card{fill:#fff;stroke:#52627a;stroke-width:2}
      .core{fill:#e8f2ff;stroke:#2463a6;stroke-width:3}.out{fill:#e9f8ef;stroke:#287a45;stroke-width:3}
      .title{font:600 22px Arial,sans-serif;fill:#172033}.label{font:18px Arial,sans-serif;fill:#344054}
      .arrow{stroke:#65758b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#65758b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="480" rx="24"/>
  <text class="title" x="45" y="45">Modalidades de entrada</text>
  <rect class="card" x="45" y="70" width="190" height="55" rx="12"/><text class="label" x="113" y="104">Texto</text>
  <rect class="card" x="45" y="140" width="190" height="55" rx="12"/><text class="label" x="102" y="174">Imagem</text>
  <rect class="card" x="45" y="210" width="190" height="55" rx="12"/><text class="label" x="111" y="244">Áudio</text>
  <rect class="card" x="45" y="280" width="190" height="55" rx="12"/><text class="label" x="87" y="314">Documento</text>
  <rect class="card" x="45" y="350" width="190" height="55" rx="12"/><text class="label" x="111" y="384">Vídeo</text>
  <path class="arrow" d="M235 98 C330 98 335 190 425 205"/>
  <path class="arrow" d="M235 168 C330 168 335 205 425 220"/>
  <path class="arrow" d="M235 238 L425 238"/>
  <path class="arrow" d="M235 308 C330 308 335 270 425 255"/>
  <path class="arrow" d="M235 378 C330 378 335 285 425 270"/>
  <rect class="core" x="425" y="155" width="335" height="165" rx="18"/>
  <text class="title" x="483" y="198">Processamento específico</text>
  <text class="label" x="493" y="238">OCR • transcrição • visão</text>
  <text class="label" x="493" y="271">layout • sequência • contexto</text>
  <path class="arrow" d="M760 238 L860 238"/>
  <rect class="out" x="860" y="170" width="290" height="135" rx="18"/>
  <text class="title" x="918" y="213">Resposta rastreável</text>
  <text class="label" x="919" y="250">evidência + origem</text>
  <text class="label" x="919" y="280">conflitos + limites</text>
</svg>
